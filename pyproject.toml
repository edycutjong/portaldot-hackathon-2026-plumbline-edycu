[project]
name = "portaldot-plumbline"
version = "0.0.1"
description = "Checks Portaldot's documented calls against the runtime they claim to describe: documented call -> verdict -> proof."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "substrate-interface==1.8.1",
  "scalecodec==1.2.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "pip-audit>=2.7"]

[project.scripts]
plumbline = "plumbline.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plumbline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# substrate-interface pulls in no async code; keep a globally installed pytest-asyncio from loading
# live tests read public chains over the network; run them explicitly with `pytest -m live`
addopts = "-p no:asyncio -m 'not live'"
markers = ["live: needs network access to a chain endpoint (deselect with -m 'not live')"]

[tool.ruff]
# fixtures are AST test inputs (deliberately broken / unresolved names); never lint or rewrite them
extend-exclude = ["fixtures", "deck"]

[tool.ruff.lint]
# pyflakes + the pycodestyle error subset: real defects only, stable across ruff versions
select = ["E4", "E7", "E9", "F"]
