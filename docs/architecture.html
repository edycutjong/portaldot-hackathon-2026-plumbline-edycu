<title id="plumbline-arch-title">Plumbline architecture: documented call → verdict → proof</title>
<desc id="plumbline-arch-desc">The Plumbline CLI reads the Portaldot mainnet docs and the V3 testnet guide into documented calls (docs.py, guide.py), reads a runtime's metadata through a checked chain profile (metadata.py), and plumb.py writes one verdict per documented entry into the drift ledger (evidence/ledger_v3.json, 549 rows). canary.py sends 3 canary transactions to the Portaldot V3 testnet and reads them back; their receipts (evidence/canary_v3.json, tabulated in docs/PROOF.md) are what make a verdict PROVEN. check.py and diff.py reuse the same chain profiles. Mainnet spec 1002 is a read-only baseline, the interim-sdk chain is a local stand-in and not V3, and the Plumbline Ledger contract is planned and not built.</desc>
