<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Plumbline — plumbs documented Portaldot calls against the live runtime and proves each verdict with a real transaction. A plumb line drops through the docs; Balances.transfer is redlined, no such call on V3.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: vellum plate, plumb line + large brass bob hanging from its hook, two courses; the lower course (cyanotype blue) already sits off-plumb — poster-complete
  10-34%  trigger:      the plumb line and its bob swing (7° → -5° → 3° → -1.2°) and settle true through the centre of the true course
  34-44%  mechanism:    A plumb line drops through the docs; Balances.transfer is redlined, no such call on V3.   data-story="beat-3" (icon form: the off-plumb course turns vermilion, its dashed as-designed outline and the offset dimension appear)
  44-93%  resolution:   the redlined course, outline and dimension stay on screen — the drift is the held state (49% of the loop)
  93-100% seam: the redline fades out (93-97%), dimension retracts while hidden, loop restarts on the poster
-->
<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
